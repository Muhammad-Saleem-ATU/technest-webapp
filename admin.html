<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNest Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div id="login-section" class="col-md-4 mx-auto bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4 text-center">Admin Login</h2>

        <input type="text" id="username" class="form-control mb-3" placeholder="Username - ex 'admin'">

        <input type="password" id="password" class="form-control mb-3" placeholder="Password - ex 'admin123'">

        <button class="btn btn-dark w-100" id="login-btn">
            Login
        </button>

        <p class="text-danger mt-3 d-none" id="login-error">
            Invalid credentials.
        </p>
    </div>


    <div id="admin-section" class="d-none">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Admin Dashboard</h1>

            <button class="btn btn-danger" id="logout-btn">
                Logout
            </button>
        </div>


        <div class="card mb-5">
            <div class="card-body">

                <h3 class="mb-4">Add Product</h3>

                <div class="row g-3">

                    <div class="col-md-6">
                        <input type="text" class="form-control" id="new-name" placeholder="Product Name" maxlength="60">
                    </div>

                    <div class="col-md-3">
                        <input type="number" class="form-control" id="new-price" min="1" placeholder="Price">
                    </div>

                    <div class="col-md-3">
                        <input type="number" class="form-control" id="new-stock" min="0" placeholder="Stock">
                    </div>

                    <div class="col-md-4">
                        <input type="text" class="form-control" id="new-category" placeholder="Category" maxlength="30">
                    </div>

                    <div class="col-md-8">
                        <!--<input type="text" class="form-control" id="new-image" placeholder="Image Path as 'assets/images/filename.jpg'">-->
						<input
							type="file"
							class="form-control"
							id="new-image"
							accept="image/*"
						>
                    </div>

                    <div class="col-12">
                        <textarea class="form-control" id="new-description" rows="3" placeholder="Description" maxlength="300"></textarea>
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary" id="add-product-btn">
                            Add Product
                        </button>
                    </div>

                </div>
            </div>
        </div>


        <div class="card">
            <div class="card-body">

                <h3 class="mb-4">Products</h3>

                <table class="table table-bordered align-middle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="products-table-body"></tbody>
                </table>

            </div>
        </div>

    </div>

</div>

<script src="js/data/products.js"></script>
<script src="js/pages/admin.js"></script>

</body>
</html>
